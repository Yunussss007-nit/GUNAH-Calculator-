<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gunah Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff6e3;--bg2:#ffd9a8;--card:rgba(255,255,255,.72);--text:#2a1b10;--mut:#7a6350;--green:#1c8a56;--green2:#27b872;--red:#c62d3a;--red2:#ee5a4a;--gold:#b8860b;--gold2:#f2b632;--line:rgba(120,80,20,.2);--inp:rgba(255,255,255,.85);--glow:rgba(242,182,50,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0a0710;--bg2:#2b0a14;--card:rgba(255,255,255,.06);--text:#f6ecdc;--mut:#b9a68f;--green:#36d98a;--green2:#14a86a;--red:#ff5a6a;--red2:#d12a3d;--gold:#ffd166;--gold2:#f0a500;--line:rgba(255,209,102,.2);--inp:rgba(0,0,0,.35);--glow:rgba(255,209,102,.4)}}
:root[data-theme="dark"]{--bg1:#0a0710;--bg2:#2b0a14;--card:rgba(255,255,255,.06);--text:#f6ecdc;--mut:#b9a68f;--green:#36d98a;--green2:#14a86a;--red:#ff5a6a;--red2:#d12a3d;--gold:#ffd166;--gold2:#f0a500;--line:rgba(255,209,102,.2);--inp:rgba(0,0,0,.35);--glow:rgba(255,209,102,.4)}
*{box-sizing:border-box}
html{min-height:100%;background:radial-gradient(900px 500px at 15% -10%,var(--glow),transparent 60%),radial-gradient(700px 500px at 100% 25%,rgba(198,45,58,.28),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed}
body{margin:0;min-height:100vh;color:var(--text);font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;padding:18px 16px 40px;max-width:780px;margin-inline:auto}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;background-image:radial-gradient(2px 2px at 12% 18%,var(--gold2),transparent),radial-gradient(1.5px 1.5px at 78% 12%,var(--gold),transparent),radial-gradient(2px 2px at 40% 70%,var(--gold2),transparent),radial-gradient(1.5px 1.5px at 90% 80%,var(--gold),transparent),radial-gradient(1.5px 1.5px at 25% 90%,var(--gold),transparent),radial-gradient(2px 2px at 62% 40%,var(--gold2),transparent);animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25;transform:translateY(0)}to{opacity:.7;transform:translateY(-8px)}}
header{text-align:center;margin:8px 0 20px}
h1{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:clamp(30px,8vw,48px);margin:0;letter-spacing:2px;background:linear-gradient(90deg,var(--gold),var(--red),var(--gold));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:sheen 4s linear infinite;filter:drop-shadow(0 4px 18px var(--glow))}
@keyframes sheen{to{background-position:200% center}}
.tag{margin:8px 0 0;color:var(--mut);font-size:14px;letter-spacing:.5px}
.card{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
label{font-size:13px;color:var(--mut);font-weight:500}
input{width:100%;padding:13px 14px;margin:6px 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--inp);color:var(--text);font:inherit;font-size:16px;outline:0;transition:.2s}
input:focus{border-color:var(--gold2);box-shadow:0 0 0 3px var(--glow)}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;color:#fff;background:linear-gradient(135deg,var(--green2),var(--green));box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .12s,filter .2s}
button:hover{filter:brightness(1.1)}
button:active{transform:scale(.95)}
button.bad{background:linear-gradient(135deg,var(--red2),var(--red))}
.main{width:100%;font-size:17px;padding:14px;color:#1a0f05;background:linear-gradient(135deg,#ffd166,#f0a500)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media (max-width:520px){.cols{grid-template-columns:1fr}}
.col{margin-bottom:0}
.col.g{border-top:3px solid var(--red);box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 34px -14px var(--red)}
.col.n{border-top:3px solid var(--green);box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 34px -14px var(--green)}
.col h2{margin:0;font-size:19px}
.col.g h2,.col.g .total{color:var(--red)}.col.n h2,.col.n .total{color:var(--green)}
.total{font-family:Cinzel,Georgia,serif;font-size:46px;font-weight:900;line-height:1.1;margin:4px 0 10px}
.total.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.35)}}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--inp);transition:.15s}
.item:hover{transform:translateX(2px);border-color:var(--gold2)}
.item span{font-size:14px}
.item span small{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--text);font-size:12px;font-weight:600}
.item button{width:38px;height:38px;padding:0;border-radius:50%;font-size:20px;line-height:1}
.res{text-align:center;font-size:17px;line-height:1.6;border:1px solid var(--gold2);box-shadow:0 0 30px -8px var(--glow)}
.res b{font-family:Cinzel,Georgia,serif;font-size:36px;display:block;margin:2px 0}
.msg{text-align:center;font-size:17px;line-height:1.7}
.hide{display:none}
.cheat{border:2px dashed var(--gold2);box-shadow:0 0 30px -10px var(--glow)}
.cheat h3{margin:0 0 10px;color:var(--gold);font-family:Cinzel,Georgia,serif;letter-spacing:1px}
.row{display:flex;gap:8px}.row input{margin:0}
.boss img{width:100%;border-radius:12px;display:block}
.oth{margin-top:12px}
.oth input{padding:10px;font-size:15px}
#calc{margin-bottom:16px;padding:16px;font-size:18px;letter-spacing:.5px;background:linear-gradient(110deg,#f0a500 20%,#fff2b3 40%,#f0a500 60%);background-size:200% 100%;animation:pulse 1.8s infinite,shim 2.6s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 10px rgba(0,0,0,0)}}
.ov{display:none;position:fixed;inset:0;background:#000;z-index:999;overflow:auto;align-items:center;justify-content:center;flex-direction:column;padding:16px;text-align:center}
.ov.show{display:flex;animation:fadeb .6s ease}
@keyframes fadeb{from{opacity:0}to{opacity:1}}
.ovc{display:none;flex-direction:column;align-items:center;gap:14px;max-width:640px;width:100%}
.ovc.pop{display:flex;animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.ovc img{width:100%;border-radius:10px;display:block}
.ovc h2{color:#fff;margin:0;font-size:22px;letter-spacing:1px;font-family:Cinzel,Georgia,serif}
.ovc button{background:linear-gradient(135deg,#ffd166,#f0a500);color:#1a0f05;padding:13px 22px;font-size:17px}
#fight{width:100%;max-width:640px;color:#fff}
#hud{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:12px}
.hb{flex:1;text-align:left}.hb.r{text-align:right}
.bar{height:12px;background:#333;border-radius:6px;overflow:hidden;margin-top:2px}
.bar.sp{height:6px;background:#2a2a2a}
.hb.r .bar{direction:rtl}
.bar i{display:block;height:100%;width:100%;background:#4cc98a}
.bar.sp i{background:#ffd54a;width:0}
.hb.r .bar i{background:#ee7a70}
#tm{font-size:22px;font-weight:700;min-width:34px;text-align:center}
#cv{width:100%;border-radius:10px;background:#111;display:block;touch-action:none}
#pw{color:#aaa;font-size:12px;margin-top:6px}
#ctl{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.pad{display:grid;gap:8px}
.pad.l,.pad.r{grid-template-columns:repeat(2,76px)}
.pad.l .up{grid-column:1/3}
.pad button{height:64px;font-size:26px;line-height:1;background:#262626;border:1px solid #555;border-radius:16px;touch-action:none;padding:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.pad button small{font-size:9px;letter-spacing:.5px;color:#bbb}
.pad button.on{background:#2e9e68}
#spb.rdy{background:#e6b800;color:#000;animation:rdy .6s infinite alternate}
#spb.rdy small{color:#000}
@keyframes rdy{from{box-shadow:0 0 0 rgba(255,213,74,0)}to{box-shadow:0 0 14px rgba(255,213,74,.9)}}
#fin .row{justify-content:center;flex-wrap:wrap}
#finimg{width:auto;max-width:100%;max-height:50vh;object-fit:contain}
#finp{color:#ddd;margin:0}
#fin button{padding:12px 14px}
.ovc img{box-shadow:0 0 40px rgba(238,90,74,.55)}
#fin.w img{box-shadow:0 0 50px rgba(255,209,102,.8)}
#fin.l img{box-shadow:0 0 50px rgba(255,60,60,.7)}
#fin h2{font-size:26px;line-height:1.25}
#fin.w h2{color:#ffd166;text-shadow:0 0 20px rgba(255,209,102,.7)}
#fin.l h2{color:#ff6a6a}
#nextBtn{animation:pulse 1.2s infinite}
#cv{border:2px solid rgba(255,209,102,.4);box-shadow:0 0 30px rgba(255,90,60,.35)}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1000}
.note{color:var(--mut);font-size:14px;margin-top:8px}
</style>
</head>
<body>
<header><h1>Gunah Calculator</h1><p class="tag">👑 Gunaho ke badshah ka hisaab-kitaab</p></header>

<div id="start" class="card">
  <label>Aapka naam</label>
  <input id="name" placeholder="Naam likhein">
  <label>Aapki umar</label>
  <input id="age" type="number" min="1" max="120" placeholder="Umar likhein">
  <button class="main" onclick="go()">Shuru karein</button>
  <p id="err" class="note"></p>
</div>

<div id="kid" class="card msg hide"></div>

<div id="app" class="hide">
  <div id="hello" class="card msg"></div>
  <div class="cols">
    <div class="card col g">
      <h2>😔 Gunah</h2>
      <div class="total" id="gt">0</div>
      <div id="glist"></div>
      <div class="row oth"><input id="og" placeholder="Other gunah..."><button class="bad" onclick="other('g')">+</button></div>
    </div>
    <div class="card col n">
      <h2>🌙 Naik Kaam</h2>
      <div class="total" id="nt">0</div>
      <div id="nlist"></div>
      <div class="row oth"><input id="on" placeholder="Other naik kaam..."><button onclick="other('n')">+</button></div>
    </div>
  </div>

  <button class="main" id="calc" onclick="calculate()">🧮 Calculate karein</button>
  <div class="card res hide" id="res"></div>
  <div class="card boss hide" id="boss"><img alt="Firaun of Egypt - Head Officer of Gunah"></div>

  <div class="ov" id="ov">
  <div class="ovc" id="ovc"><img id="ovimg" alt="Head Officer of Gunah"><h2>Your next opponent is him</h2><button id="nextBtn" class="hide" onclick="startFight()">Next ▶</button></div>
  <div id="fight" class="hide">
    <div id="hud">
      <div class="hb"><span id="pn">Tum</span><div class="bar"><i id="php"></i></div><div class="bar sp"><i id="spf"></i></div></div>
      <div id="tm">90</div>
      <div class="hb r"><span>👹 BOSS</span><div class="bar"><i id="ohp"></i></div></div>
    </div>
    <canvas id="cv" width="640" height="360"></canvas>
    <div id="pw"></div>
    <div id="ctl">
      <div class="pad l"><button data-k="up" class="up">▲<small>JUMP</small></button><button data-k="left">◀</button><button data-k="right">▶</button></div>
      <div class="pad r"><button data-k="special" id="spb">⚡<small>POWER</small></button><button data-k="block">🛡<small>BLOCK</small></button><button data-k="punch">👊<small>PUNCH</small></button><button data-k="kick">🦵<small>KICK</small></button></div>
    </div>
  </div>
  <div class="ovc" id="fin"><img id="finimg" alt=""><h2 id="fint"></h2><p id="finp"></p><div class="row"><button onclick="startFight()">Dobara ladein</button><button onclick="closeOv()">Calculator par wapas</button></div></div>
</div>

  <div class="card cheat">
    <h3>✨ Astagfirullah Cheat Code</h3>
    <button class="main" onclick="astag()">Astagfirullah kahein (−1 gunah)</button>
    <p class="note" id="acount"></p>
    <p class="note">Ya cheat code likhein <b>astagfirullah</b> — saare gunah maaf!</p>
    <div class="row"><input id="code" placeholder="Cheat code"><button onclick="cheat()">Lagao</button></div>
  </div>
</div>

<canvas id="cf"></canvas>
<script>
var G=["Jhoot bola","Ghibat ki","Namaz chhodi","Gussa kiya","Walidain ko naraz kiya","Waqt zaya kiya"];
var N=["Namaz parhi","Quran parha","Sadqa diya","Walidain ki khidmat","Kisi ki madad ki","Zikr/Durood parha"];
var g={},n={},ast=0,user="";
function go(){
  var nm=document.getElementById("name").value.trim(),ag=+document.getElementById("age").value;
  if(!nm||!ag){document.getElementById("err").textContent="Pehle naam aur umar likhein.";return}
  user=nm;document.getElementById("start").classList.add("hide");
  if(ag<9){var k=document.getElementById("kid");k.classList.remove("hide");
    k.innerHTML="👶 "+esc(nm)+", aapki umar abhi kam hai.<br><b>Abhi bhar ke gunah kar sakte ho!</b> Abhi koi hisaab nahi. 🌱"}
  else{document.getElementById("app").classList.remove("hide");
    document.getElementById("hello").innerHTML="Assalam o Alaikum, <b>"+esc(nm)+"</b> ("+ag+" saal)<br>Ek gunah ke badle ek naik kaam hisaab barabar kar deta hai."}
  render();
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function drawF(f){
  var gy=GY-f.y,sc=f.sc,hit=f.flash>0,isP=f.p,nm=isP?(user||"Tum"):"BOSS • Head Officer of Gunah",lx=Math.max(80,Math.min(W-80,f.x));
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(f.x,GY+3,28*sc*Math.max(.4,1-f.y/220),6*sc,0,0,7);ctx.fill();
  ctx.save();ctx.translate(f.x,gy);ctx.scale(f.f*sc,sc);
  if(f.stun>0)ctx.rotate(-.12);
  if(!isP&&(f.chg>0||f.rage||st=="intro")){var gr=ctx.createRadialGradient(0,-60,8,0,-60,95);gr.addColorStop(0,f.chg>0?"rgba(255,90,30,.7)":"rgba(255,40,40,.4)");gr.addColorStop(1,"rgba(255,40,40,0)");ctx.fillStyle=gr;ctx.fillRect(-110,-170,220,220)}
  var skin=hit?"#fff":"#e0a97a",shirt=hit?"#fff":(isP?"#1e5fd0":"#2b0f14"),pants=hit?"#fff":(isP?"#2b3a55":"#14090b"),shoe=hit?"#fff":(isP?"#f2f2f2":"#c9a227");
  var a=f.atk,kick=a&&a.type=="kick"&&a.t>.1&&a.t<.32,punch=a&&a.type=="punch"&&a.t>.05&&a.t<.19;
  var sw=(f.mv&&!a&&f.y==0&&f.stun<=0)?Math.sin(ft*14)*9:0;
  if(!isP){ctx.fillStyle=hit?"#fff":"#6b0f17";ctx.beginPath();ctx.moveTo(-6,-86);ctx.lineTo(-38+Math.sin(ft*5)*4,-6);ctx.lineTo(6,-14);ctx.closePath();ctx.fill()}
  var bx=-13-sw,fx=13+sw;
  limb(0,-46,bx,-4,11,pants);limb(bx,-3,bx+9,-3,8,shoe);
  if(kick){limb(0,-46,72,-52,11,pants);limb(72,-52,82,-52,8,shoe)}else{limb(0,-46,fx,-4,11,pants);limb(fx,-3,fx+9,-3,8,shoe)}
  limb(0,-48,0,-84,27,shirt);
  if(!isP){limb(-13,-52,13,-52,5,hit?"#fff":"#d4a017");limb(-12,-86,12,-86,6,hit?"#fff":"#d4a017")}
  else limb(-13,-52,13,-52,4,hit?"#fff":"#16264a");
  limb(-2,-78,-14,-62,9,shirt);limb(-14,-62,-16,-56,8,skin);
  if(punch){limb(4,-78,54,-78,9,shirt);limb(54,-78,62,-78,12,skin)}
  else if(f.blk){limb(4,-78,22,-98,9,shirt);limb(22,-98,26,-103,11,skin)}
  else{limb(4,-78,20,-64,9,shirt);limb(20,-64,24,-60,10,skin)}
  ctx.save();ctx.translate(2,-105);ctx.scale(f.f,1);ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.closePath();ctx.clip();
  var im=isP?hpImg:hdImg;
  if(im.complete&&im.naturalWidth)ctx.drawImage(im,-21,-21,42,42);else{ctx.fillStyle="#a66";ctx.fillRect(-21,-21,42,42)}
  if(hit){ctx.fillStyle="rgba(255,255,255,.55)";ctx.fillRect(-21,-21,42,42)}
  ctx.restore();
  ctx.strokeStyle=isP?"#2ecc71":"#e63946";ctx.lineWidth=3;ctx.beginPath();ctx.arc(2,-105,20,0,7);ctx.stroke();
  ctx.restore();
  ctx.fillStyle="#fff";ctx.font="bold 12px system-ui,sans-serif";ctx.textAlign="center";
  ctx.fillText(nm,lx,gy-138*sc);
  if(f.chg>0&&Math.floor(ft*10)%2==0){ctx.fillStyle="#ff6a3d";ctx.font="bold 18px system-ui,sans-serif";ctx.fillText("GUNAH BLAST!",lx,gy-160*sc)}
}
function drawFX(){
  PR.forEach(function(p){var y=GY-p.h,gr=ctx.createRadialGradient(p.x,y,2,p.x,y,p.r*1.6);gr.addColorStop(0,"#fff");gr.addColorStop(.4,p.c);gr.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,y,p.r*1.6,0,7);ctx.fill()});
  ctx.fillStyle="#ffd54a";SPK.forEach(function(s){ctx.fillRect(s.x,s.y,4,4)});
}
function banner(t,c){ctx.fillStyle=c||"#fff";ctx.strokeStyle="#000";ctx.lineWidth=6;ctx.font="bold 58px system-ui,sans-serif";ctx.textAlign="center";ctx.strokeText(t,W/2,170);ctx.fillText(t,W/2,170)}
function loop(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;ft+=dt;
  if(st=="intro"){introT-=dt;if(introT<=0)st="fight"}
  if(st=="fight"){
    T-=dt;
    P.mv=K.right-K.left;P.blk=!!K.block&&P.y==0&&!P.atk&&P.stun<=0;
    if(K.up&&P.y==0&&P.stun<=0&&!P.atk)P.vy=520;
    aiThink(dt);upd(P,O,dt);upd(O,P,dt);
    for(var i=PR.length-1;i>=0;i--){var p=PR[i];p.x+=p.vx*dt;var own=p.own=="O",tg=own?P:O,at=own?O:P;
      if(Math.abs(p.x-tg.x)<20*tg.sc+p.r&&(!own||tg.y<55)){dealHit(tg,at,p.dmg,300,p.vx>0?1:-1,1);PR.splice(i,1)}
      else if(p.x<-50||p.x>W+50)PR.splice(i,1)}
    if(P.hp<=0||O.hp<=0||T<=0)endGame();
  }else if(st=="end"){upd(P,O,dt);upd(O,P,dt)}
  if(shk>0)shk-=dt;
  SPK.forEach(function(s){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=600*dt;s.t-=dt});SPK=SPK.filter(function(s){return s.t>0});
  ctx.save();if(shk>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  bgDraw();drawF(O);drawF(P);drawFX();
  ctx.restore();
  if(st=="intro")banner(introT>1.3?"BOSS LEVEL!":"FIGHT!",introT>1.3?"#ff5a3d":"#fff");else if(st=="end")banner(koText);
  document.getElementById("php").style.width=(P.hp/P.max*100)+"%";
  document.getElementById("ohp").style.width=(O.hp/O.max*100)+"%";
  document.getElementById("spf").style.width=P.sp+"%";
  document.getElementById("spb").classList.toggle("rdy",P.sp>=100);
  document.getElementById("tm").textContent=Math.max(0,Math.ceil(T));
  if(running)raf=requestAnimationFrame(loop);
}
function endGame(){
  st="end";P.mv=O.mv=0;P.blk=O.blk=false;PR=[];
  win=(O.hp<=0&&P.hp>0)?true:(P.hp<=0?false:(P.hp/P.max>O.hp/O.max));
  koText=T<=0?"TIME!":"K.O.";bgStop();
  try{koA=new Audio(FX[win?0:1]);var pp=koA.play();if(pp&&pp.catch)pp.catch(function(){})}catch(e){}
  endT=setTimeout(function(){
    running=false;cancelAnimationFrame(raf);
    document.getElementById("fight").classList.add("hide");
    endT=setTimeout(showFin,900);
  },1300);
}
function confetti(ms){
  var c=document.getElementById("cf"),x=c.getContext("2d");c.width=window.innerWidth;c.height=window.innerHeight;
  var cols=["#ffd166","#ff5a6a","#36d98a","#4aa8ff","#ffffff"],ps=[];
  for(var i=0;i<140;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%5]});
  var t0=performance.now();
  (function f(now){var dt=now-t0;x.clearRect(0,0,c.width,c.height);
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    if(dt<(ms||3500))requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0);
}
function bump(id){var e=document.getElementById(id);e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}
function showFin(){
  try{if(koA){koA.pause()}var en=new Audio(ENDS);var pe=en.play();if(pe&&pe.catch)pe.catch(function(){})}catch(e){}
  if(win)confetti(4500);
  document.getElementById("finimg").src=win?PH3:PH2;
  document.getElementById("fint").textContent=win?"👑 Aaj gunaho ke badshah hum hain!":"😈 Gunehgar jeet gaya!";
  document.getElementById("finp").textContent=win?"Boss haar gaya.":"Pehle gunah badhao, phir aana.";
  var fe=document.getElementById("fin");fe.classList.remove("w","l");fe.classList.add("pop",win?"w":"l");
}
function startFight(){
  clearTimeout(nxT);clearTimeout(endT);cancelAnimationFrame(raf);
  document.getElementById("ovc").classList.remove("pop");
  document.getElementById("fin").classList.remove("pop");
  document.getElementById("fight").classList.remove("hide");
  if(a2){a2.pause();a2=null}
  cv=document.getElementById("cv");ctx=cv.getContext("2d");
  pm=1.2+Math.min(sum(g),15)*.1;
  document.getElementById("pw").textContent="Gunah power: ×"+pm.toFixed(1)+" ("+sum(g)+" gunah) | Boss: size bada, health zyada, special: Gunah Blast";
  document.getElementById("pn").textContent=user||"Tum";
  P=mk(130,1,true);O=mk(500,-1,false);P.sp=Math.min(50,sum(g)*5);O.spT=5;
  T=90;st="intro";introT=2.4;koText="";PR=[];SPK=[];ft=0;shk=0;
  K.left=K.right=K.up=K.block=0;ai={t:0,m:"idle",seen:0};
  running=true;bgOn=true;bgList=[];bgNext();
  last=performance.now();raf=requestAnimationFrame(loop);
}
(function(){
  document.querySelectorAll("#ctl button").forEach(function(b){
    var k=b.getAttribute("data-k");
    b.addEventListener("pointerdown",function(e){e.preventDefault();
      if(k=="punch")fire(P,"punch");else if(k=="kick")fire(P,"kick");else if(k=="special")special();else{K[k]=1;b.classList.add("on")}});
    ["pointerup","pointercancel","pointerleave"].forEach(function(n){b.addEventListener(n,function(e){
      if(K.hasOwnProperty(k)){K[k]=0;b.classList.remove("on")}})});
    b.addEventListener("contextmenu",function(e){e.preventDefault()});
  });
  var map={ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right",ArrowUp:"up",w:"up"," ":"up",l:"block",c:"block",ArrowDown:"block",s:"block"};
  document.addEventListener("keydown",function(e){
    if(!running)return;var k=e.key.length>1?e.key:e.key.toLowerCase();
    if(map[k]){K[map[k]]=1;e.preventDefault()}
    else if(k=="j"||k=="z")fire(P,"punch");else if(k=="k"||k=="x")fire(P,"kick");else if(k=="e"||k=="u")special();
  });
  document.addEventListener("keyup",function(e){
    var k=e.key.length>1?e.key:e.key.toLowerCase();if(map[k])K[map[k]]=0;
  });
})();

function over(){return sum(g)>sum(n)+ast}
function add(type,i){var o=type=="g"?g:n;o[i]=(o[i]||0)+1;render();bump(type=="g"?"gt":"nt");if(type=="g")tune()}
function other(type){var el=document.getElementById(type=="g"?"og":"on"),t=el.value.trim();if(!t)return;
  var arr=type=="g"?G:N;arr.push(esc(t));el.value="";add(type,arr.length-1)}
function astag(){ast++;render();document.getElementById("acount").textContent="Astagfirullah: "+ast+" baar"}
function cheat(){
  var c=document.getElementById("code");
  if(c.value.trim().toLowerCase()=="astagfirullah"){g={};ast=0;c.value="";render();document.getElementById("acount").textContent="🤲 Cheat code lag gaya! Saare gunah saaf. Ab Calculate dabayein."}
  else c.placeholder="Ghalat code, dobara koshish karein"
}
function list(arr,type,o){
  return arr.map(function(t,i){return '<div class="item"><span>'+t+' <small>×'+(o[i]||0)+'</small></span><button class="'+(type=="g"?"bad":"")+'" onclick="add(\''+type+'\','+i+')">+</button></div>'}).join("")
}
function render(){
  document.getElementById("glist").innerHTML=list(G,"g",g);
  document.getElementById("nlist").innerHTML=list(N,"n",n);
  document.getElementById("gt").textContent=sum(g);
  document.getElementById("nt").textContent=sum(n);
  document.getElementById("res").classList.add("hide");
  document.getElementById("boss").classList.add("hide");
  if(a2){a2.pause();a2=null}
}
function calculate(){
  var gt=sum(g),nt=sum(n),left=Math.max(0,gt-nt-ast),extra=Math.max(0,nt+ast-gt),r;
  if(gt==0&&nt==0)r="Pehle kuch gunah ya naik kaam add karein.";
  else{
    r="Gunah: <b style='color:var(--red)'>"+gt+"</b> | Naik kaam: <b style='color:var(--green)'>"+nt+"</b>";
    if(ast)r+="<div class='note'>Astagfirullah: "+ast+" baar</div>";
    if(left>0)r+="<br>Bache hue gunah<b style='color:var(--red)'>"+left+"</b>Aur naik kaam karein ya Astagfirullah kahein 🤲";
    else r+="<br>Gunah barabar! Extra naik kaam<b style='color:var(--green)'>"+extra+"</b>MashaAllah 🌟";
  }
  var res=document.getElementById("res");res.innerHTML=r;res.classList.remove("hide");
  var bs=document.getElementById("boss");
  if(left>0){showOv()}
  else{bs.classList.add("hide");if(a2){a2.pause();a2=null}if(gt+nt>0)confetti(2500)}
}
</script>
